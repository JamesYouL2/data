name: Build and deploy pages

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC (after nflverse's overnight stats update); runs from the default branch only
  workflow_dispatch:
  push:
    branches: [master, career-value]
    paths: ["pages/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - name: Download inputs
        run: bash build/fetch.sh raw
      - name: Build player calls
        run: python -I build/build_data.py raw _site/data/players.js
      - name: Assemble site
        run: cp index.html app.js style.css _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
